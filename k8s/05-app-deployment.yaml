apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portal-storage-pvc
  namespace: hackathon-portal
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-deployment
  namespace: hackathon-portal
  labels:
    app: hackathon-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hackathon-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hackathon-portal
    spec:
      containers:
        - name: web
          image: natesakrishnan/hackathon-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: portal-config
            - secretRef:
                name: portal-secrets
          readinessProbe:
            httpGet:
              path: /api/config
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/config
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: cert-storage
              mountPath: /app/app/static/certificates
      volumes:
        - name: cert-storage
          persistentVolumeClaim:
            claimName: portal-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: portal-service
  namespace: hackathon-portal
spec:
  selector:
    app: hackathon-portal
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP
