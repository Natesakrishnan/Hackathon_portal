<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="glyphGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGradient)" filter="url(#shadow)"/>
  <rect x="26" y="26" width="460" height="460" rx="102" fill="none" stroke="#60A5FA" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Geometric Tech Monogram 'S' -->
  <path d="M 340 160 L 190 160 C 160 160 160 210 160 230 C 160 260 180 270 210 275 L 300 290 C 335 295 345 315 345 340 C 345 375 320 395 275 395 L 160 395" 
        fill="none" stroke="url(#glyphGradient)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Amber Accent Pulse Dot -->
  <circle cx="348" cy="168" r="22" fill="#F59E0B"/>
</svg>
